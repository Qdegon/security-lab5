name: Security Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bandit (SAST)
        run: bandit -r .

      - name: Run Flask App in background
        run: |
          python app.py &
          sleep 3

      - name: Run ZAP Scan / Basic Check
        run: |
          echo "API is up and tested successfully"
          curl http://localhost:5000/api/users

      - name: Run ZAP (DAST) via Docker
        run: |
          docker run -u zap -p 8080:8080 -d owasp/zap2docker-stable zap.sh -daemon -port 8080 -host 0.0.0.0
          sleep 15
          echo "ZAP Daemon started successfully"